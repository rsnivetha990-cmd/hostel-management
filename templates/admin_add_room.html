{% extends "base.html" %}
{% block title %}Add Room{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3"><i class="bi bi-door-open"></i> Add Room</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small">Block</label>
          <input type="text" name="block" class="form-control" placeholder="A" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Floor</label>
          <input type="number" name="floor" class="form-control" value="1" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Room Number</label>
          <input type="text" name="room_number" class="form-control" placeholder="A104" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Capacity</label>
          <input type="number" name="capacity" class="form-control" value="4" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Gender</label>
          <select name="gender" class="form-select">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="any">Any</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Add Room</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
