{% extends "base.html" %}
{% block title %}Scan QR{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3"><i class="bi bi-qr-code-scan"></i> Mark Attendance</h4>
      <p class="text-muted">Point your camera at the QR code displayed by the warden, or enter the code manually below.</p>

      <div id="reader" class="mb-3"></div>

      <form method="POST" id="tokenForm">
        <div class="mb-3">
          <label class="form-label">QR Token</label>
          <input type="text" class="form-control" name="token" id="tokenInput" placeholder="Paste or scan token here" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit Attendance</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
  try {
    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    scanner.render((decodedText) => {
      document.getElementById("tokenInput").value = decodedText;
      scanner.clear();
      document.getElementById("tokenForm").submit();
    });
  } catch (e) {
    console.log("Camera scanner unavailable, manual entry only.");
  }
</script>
{% endblock %}
