<div class="row justify-content-center text-center">
  <div class="col-md-7 col-lg-6">
    <div class="card p-4 qr-box shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1">
          <i class="bi bi-shield-check"></i> Entrance Anti-Proxy Mode
        </span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="autoRotateToggle" checked>
          <label class="form-check-label small fw-semibold" for="autoRotateToggle">Auto-Rotate (30-60s)</label>
        </div>
      </div>

      <h4 class="mb-1 fw-bold">{{ qr.session_label }}</h4>
      <p class="text-muted small">Display this at the hostel entrance gate. Code rotates automatically.</p>

      <div class="position-relative d-inline-block mx-auto my-2">
        <img id="qrImage" src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code" class="img-fluid rounded border shadow-sm" style="max-width: 270px;">
      </div>

      <div class="p-2 bg-light rounded mt-2 mb-3 border">
        <small class="text-muted d-block">Current Entrance Token (rotates automatically):</small>
        <code class="fs-6 fw-bold text-primary" id="tokenDisplay">{{ qr.token }}</code>
      </div>

      <div class="d-flex justify-content-center gap-2 mb-3">
        <span class="badge bg-primary fs-6 py-2 px-3" id="countdown">Loading timer...</span>
        <span class="badge bg-success fs-6 py-2 px-3" id="presentCount">0 marked present</span>
      </div>

      <div class="border-top pt-3 mt-2">
        <div class="d-flex justify-content-between gap-2">
          <button id="syncLocationBtn" class="btn btn-sm btn-outline-secondary" onclick="syncGateLocation()">
            <i class="bi bi-geo-alt-fill text-danger"></i> Set Gate to My GPS
          </button>
          <button id="forceRotateBtn" class="btn btn-sm btn-outline-primary" onclick="rotateQRCode()">
            <i class="bi bi-arrow-repeat"></i> Rotate Now
          </button>
        </div>
        <div id="locationStatus" class="small text-muted mt-2"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const qrId = {{ qr.id }};
  let isRotating = false;

  function poll() {
    fetch(`/api/qr/${qrId}/status`)
      .then(r => r.json())
      .then(data => {
        const cd = document.getElementById('countdown');
        const pc = document.getElementById('presentCount');
        const tokenDisplay = document.getElementById('tokenDisplay');
        pc.textContent = `${data.present_count} marked present`;
        if (data.token) {
          tokenDisplay.textContent = data.token;
        }

        if (data.valid && data.seconds_left > 0) {
          const m = Math.floor(data.seconds_left / 60);
          const s = data.seconds_left % 60;
          cd.textContent = `Rotates in ${m}:${s.toString().padStart(2,'0')}`;
          cd.className = 'badge bg-primary fs-6 py-2 px-3';
        } else {
          cd.textContent = 'Code Expired';
          cd.className = 'badge bg-danger fs-6 py-2 px-3';
          if (document.getElementById('autoRotateToggle').checked && !isRotating) {
            rotateQRCode();
          }
        }
      })
      .catch(err => console.error("Poll error:", err));
  }

  function rotateQRCode() {
    if (isRotating) return;
    isRotating = true;
    const cd = document.getElementById('countdown');
    cd.textContent = "Rotating Code...";

    fetch(`/api/qr/${qrId}/rotate`, { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          document.getElementById('qrImage').src = "data:image/png;base64," + data.qr_b64;
          document.getElementById('tokenDisplay').textContent = data.token;
        }
      })
      .finally(() => {
        setTimeout(() => { isRotating = false; poll(); }, 1200);
      });
  }

  function syncGateLocation() {
    const locStatus = document.getElementById('locationStatus');
    if (!navigator.geolocation) {
      locStatus.textContent = "Geolocation not supported by this browser.";
      return;
    }
    locStatus.textContent = "Detecting current coordinates...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        fetch('/api/hostel-location/sync-my-location', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude
          })
        })
        .then(r => r.json())
        .then(res => {
          locStatus.innerHTML = `<span class="text-success"><i class="bi bi-check-circle"></i> Hostel gate synced to: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}</span>`;
        });
      },
      (err) => {
        locStatus.innerHTML = `<span class="text-danger">GPS error: ${err.message}</span>`;
      },
      { enableHighAccuracy: true }
    );
  }

  poll();
  setInterval(poll, 2000);
</script>
{% endblock %}
