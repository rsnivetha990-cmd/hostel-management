{% extends "base.html" %}
{% block title %}Add Resident - Smart Hostel{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm border-0">
      <h4 class="mb-3"><i class="bi bi-person-plus text-primary"></i> Add New Resident</h4>
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" name="full_name" class="form-control" required placeholder="e.g. Priya R">
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Gender</label>
            <select name="gender" class="form-select">
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="any">Any</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Username (login)</label>
            <input type="text" name="username" class="form-control" required placeholder="Choose username">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Password</label>
            <input type="text" name="password" class="form-control" placeholder="default: student123">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email (Optional)</label>
            <input type="email" name="email" class="form-control" placeholder="name@hostel.edu">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Phone (Optional)</label>
            <input type="text" name="phone" class="form-control" placeholder="9876543210">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-semibold">Add Resident</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
