{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3"><i class="bi bi-person-plus"></i> Add New Student</h4>
      <form method="POST">
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label small">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Student Code</label>
            <input type="text" name="student_code" class="form-control" placeholder="ST006" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Username (login)</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Password</label>
            <input type="text" name="password" class="form-control" placeholder="default: changeme123">
          </div>
          <div class="col-md-6">
            <label class="form-label small">Email</label>
            <input type="email" name="email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small">Phone</label>
            <input type="text" name="phone" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label small">Department</label>
            <input type="text" name="department" class="form-control" placeholder="CSE">
          </div>
          <div class="col-md-3">
            <label class="form-label small">Year</label>
            <input type="number" name="year" class="form-control" min="1" max="5" value="1">
          </div>
          <div class="col-md-3">
            <label class="form-label small">Gender</label>
            <select name="gender" class="form-select">
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="any">Any</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3">Add Student</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
